services:
  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    env_file:
      - .env
    container_name: ai_lawyer_django

    volumes:
      - ./backend:/app
      - media_data:/app/media
      - model_cache:/models # shared ML cache

    ports:
      - "8000:8000"

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant

      # ML MODEL PATHS (CRITICAL FIX)
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      RAPIDOCR_MODEL_DIR: /models/rapidocr

    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      db:
        condition: service_healthy # Waits for the DB healthcheck to pass

    networks:
      - ai_net

  db:
    image: pgvector/pgvector:pg16
    container_name: ai_lawyer_db
    restart: always
    environment:
      POSTGRES_DB: lawyer_db
      POSTGRES_USER: lawyer_admin
      POSTGRES_PASSWORD: z0m1qpoz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Fixed the database name here to match POSTGRES_DB
      test: [ "CMD-SHELL", "pg_isready -U lawyer_admin -d lawyer_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_net # Added this so Django/Celery can reach the DB

  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: ai_lawyer_celery

    volumes:
      - ./backend:/app
      - media_data:/app/media
      - model_cache:/models # shared cache with django

    command: celery -A config worker -l info --concurrency=1

    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant

      # MUST MATCH DJANGO (IMPORTANT)
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      RAPIDOCR_MODEL_DIR: /models/rapidocr

    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      db:
        condition: service_healthy # Waits for the DB healthcheck to pass

    networks:
      - ai_net

  redis:
    image: redis:7-alpine
    container_name: ai_lawyer_redis
    ports:
      - "6379:6379"
    networks:
      - ai_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_lawyer_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  qdrant_data:
  media_data:
  model_cache: # persistent ML model storage
  postgres_data:
