services:

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: ai_lawyer_django

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine

    container_name: ai_lawyer_redis

    ports:
      - "6379:6379"

  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile

    container_name: ai_lawyer_celery

    volumes:
      - ./backend:/app

    command: celery -A config worker -l info

    depends_on:
      - redis
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest

    container_name: ai_lawyer_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:
  qdrant_data: