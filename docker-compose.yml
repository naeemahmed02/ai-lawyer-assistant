version: "3.9"

services:
  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    env_file:
      - .env
    container_name: ai_lawyer_django

    volumes:
      - ./backend:/app
      - media_data:/app/media
      - model_cache:/models # shared ML cache

    ports:
      - "8000:8000"

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant

      # ML MODEL PATHS (CRITICAL FIX)
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      RAPIDOCR_MODEL_DIR: /models/rapidocr

    depends_on:
      - redis
      - qdrant

    networks:
      - ai_net

  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    container_name: ai_lawyer_celery

    volumes:
      - ./backend:/app
      - media_data:/app/media
      - model_cache:/models # shared cache with django

    command: celery -A config worker -l info --concurrency=4

    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant

      # MUST MATCH DJANGO (IMPORTANT)
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      RAPIDOCR_MODEL_DIR: /models/rapidocr

    depends_on:
      - redis
      - qdrant

    networks:
      - ai_net

  redis:
    image: redis:7-alpine
    container_name: ai_lawyer_redis
    ports:
      - "6379:6379"
    networks:
      - ai_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_lawyer_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  qdrant_data:
  media_data:
  model_cache: # persistent ML model storage
